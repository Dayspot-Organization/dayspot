<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cadastro da empresa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Nunito:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ds [data-tema="escuro"],.ds[data-tema="escuro"]{--ds-fundo:#1A1417;--ds-superficie:#251D21;--ds-hover:#30272B;--ds-divisoria:#463A40;--ds-borda:#857880;--ds-texto:#F5ECEF;--ds-texto-2:#C0B0B7;--ds-texto-3:#857880;--ds-acao:#EE9DBF;--ds-acao-pressionada:#F4B4CF;--ds-acao-suave:#33222B;--ds-acao-texto:#1A1417;--ds-acento:#F4B49A;--ds-foco:rgba(238,157,191,.32);--ds-confirmado:#7FCF86;--ds-confirmado-texto:#7FCF86;--ds-confirmado-chip:#24362A;--ds-aguardando:#F2C14E;--ds-aguardando-texto:#F2C14E;--ds-aguardando-chip:#3A3220;--ds-cancelado:#B5ACA4;--ds-cancelado-texto:#B5ACA4;--ds-cancelado-chip:#34302D;--ds-feito:#8DBCE3;--ds-feito-texto:#8DBCE3;--ds-feito-chip:#1F2E3B;--ds-faltou:#B9A5F5;--ds-faltou-texto:#B9A5F5;--ds-faltou-chip:#2F2843;--ds-erro:#FF8A85;--ds-erro-texto:#FF8A85;--ds-erro-chip:#42282A;--ds-grafico-marcado:#A85A80;--ds-sombra:none;--ds-sombra-forte:none;--ds-veu:rgba(0,0,0,.6);color:var(--ds-texto)}
.ds{--ds-fundo:#FBF7F5;--ds-superficie:#FFFFFF;--ds-hover:#F4ECEA;--ds-divisoria:#EEE3E0;--ds-borda:#8E807F;--ds-texto:#2B2227;--ds-texto-2:#5B4D53;--ds-texto-3:#8E807F;--ds-acao:#86315C;--ds-acao-pressionada:#6E2A55;--ds-acao-suave:#FBF4F7;--ds-acao-texto:#FFFFFF;--ds-acento:#F4A08A;--ds-foco:rgba(134,49,92,.28);--ds-confirmado:#2E7D32;--ds-confirmado-texto:#22622A;--ds-confirmado-chip:#E4F2E4;--ds-aguardando:#A87400;--ds-aguardando-texto:#7A5200;--ds-aguardando-chip:#FCF0CF;--ds-cancelado:#8C8279;--ds-cancelado-texto:#5F5750;--ds-cancelado-chip:#EEEAE5;--ds-feito:#1F5F8B;--ds-feito-texto:#1B527A;--ds-feito-chip:#E3EDF5;--ds-faltou:#7350D6;--ds-faltou-texto:#5A3BB8;--ds-faltou-chip:#EEE9FC;--ds-erro:#D1242F;--ds-erro-texto:#A8161F;--ds-erro-chip:#FDE6E6;--ds-grafico-recebido:var(--ds-acao);--ds-grafico-marcado:#D98AAE;--ds-sombra:0 1px 3px rgba(43,34,39,.12);--ds-sombra-forte:0 12px 32px rgba(43,34,39,.12);--ds-veu:rgba(26,20,23,.48);--ds-marca-claro:#FBF7F5;--ds-dia-manha:#FFD9B0;--ds-degrade:linear-gradient(180deg,#FFD9B0 0%,#F4A08A 38%,#C9587E 70%,#6E2A55 100%);
font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ds-texto);background:var(--ds-fundo);font-size:16px;line-height:24px;width:100%}
.ds *{box-sizing:border-box}
.ds p{margin:0}
.nu{font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800}
.h1{font-family:Nunito,ui-rounded,sans-serif;font-weight:800;font-size:40px;line-height:44px;letter-spacing:-0.015em;margin:0}
.h2{font-family:Nunito,ui-rounded,sans-serif;font-weight:800;font-size:28px;line-height:34px;letter-spacing:-0.01em;margin:0}
.h3{font-family:Nunito,ui-rounded,sans-serif;font-weight:700;font-size:20px;line-height:26px;margin:0}
.h4{font-weight:700;font-size:16px;line-height:22px;margin:0}
.leg{font-size:13px;line-height:18px;font-weight:500;color:var(--ds-texto-2)}
.t2{color:var(--ds-texto-2)}
.num{font-variant-numeric:tabular-nums}
.hr{font-family:Nunito,ui-rounded,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.card{background:var(--ds-superficie);border:1px solid var(--ds-divisoria);border-radius:24px}
.btn{font-family:inherit;font-size:16px;line-height:20px;font-weight:600;height:44px;padding:0 20px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.b1{background:var(--ds-acao);color:var(--ds-acao-texto)}.b1:hover{background:var(--ds-acao-pressionada)}
.b2{background:var(--ds-hover);color:var(--ds-texto)}
.b3{background:transparent;color:var(--ds-acao);padding:0 8px}
.b4{background:transparent;color:var(--ds-erro-texto);padding:0 8px}
.bs{height:36px;font-size:15px;padding:0 14px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--ds-hover);color:var(--ds-texto);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.campo .lb{font-size:15px;font-weight:600}
.in{font-family:inherit;font-size:16px;height:48px;border-radius:16px;border:1.5px solid var(--ds-borda);padding:0 16px;background:var(--ds-superficie);color:var(--ds-texto);width:100%}
.in:focus{outline:3px solid var(--ds-foco);outline-offset:1px;border-color:var(--ds-acao)}
.ajuda{font-size:13px;line-height:18px;color:var(--ds-texto-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;width:max-content}
.c-conf{background:var(--ds-confirmado-chip);color:var(--ds-confirmado-texto)}.c-agu{background:var(--ds-aguardando-chip);color:var(--ds-aguardando-texto)}.c-can{background:var(--ds-cancelado-chip);color:var(--ds-cancelado-texto)}.c-feito{background:var(--ds-feito-chip);color:var(--ds-feito-texto)}.c-falta{background:var(--ds-faltou-chip);color:var(--ds-faltou-texto)}.c-erro{background:var(--ds-erro-chip);color:var(--ds-erro-texto)}.c-neu{background:var(--ds-hover);color:var(--ds-texto-2)}
.seg{display:inline-flex;background:var(--ds-hover);border-radius:999px;padding:4px;gap:2px}
.seg button{font-family:inherit;font-size:15px;font-weight:600;border:0;height:36px;padding:0 16px;border-radius:999px;background:transparent;color:var(--ds-texto-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ds-superficie);color:var(--ds-texto);box-shadow:var(--ds-sombra)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--ds-hover);color:var(--ds-texto)}
.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb th{font-size:13px;font-weight:600;color:var(--ds-texto-2);text-align:left;padding:14px 16px 8px}
.tb td{padding:14px 16px;border-top:1px solid var(--ds-divisoria);vertical-align:middle}
.tb th:first-child,.tb td:first-child{padding-left:24px}.tb th:last-child,.tb td:last-child{padding-right:24px}
.sw{width:44px;height:26px;border-radius:999px;border:0;position:relative;flex:none;cursor:pointer}
.sw span{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:var(--ds-superficie);box-shadow:var(--ds-sombra)}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 16px;font-size:15px;line-height:22px}
a{color:var(--ds-acao)}a:hover{color:var(--ds-acao-pressionada)}
.btn{transition:background-color 150ms}
.btn:focus-visible,.ib:focus-visible,.sw:focus-visible,.seg button:focus-visible,.lat a:focus-visible,.in:focus-visible,button:focus-visible,a:focus-visible,.is-foco{outline:3px solid var(--ds-foco);outline-offset:2px}
.in:focus-visible,.in.is-foco{outline-offset:1px;border-color:var(--ds-acao)}
.b1.is-hover{background:var(--ds-acao-pressionada)}
.b2:hover,.ib:hover,.b2.is-hover{background:color-mix(in srgb,var(--ds-texto) 6%,var(--ds-hover))}
.b3:hover{background:var(--ds-hover)}
.b4:hover{background:var(--ds-erro-chip)}
.b5{background:var(--ds-erro-texto);color:var(--ds-acao-texto)}
.btn:disabled{background:var(--ds-hover);color:var(--ds-texto-3);cursor:not-allowed}
.btn.is-carregando{color:transparent;position:relative}
.btn.is-carregando::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ds-acao-texto);border-right-color:transparent;animation:ds-gira .8s linear infinite}
.b2.is-carregando::after{border-color:var(--ds-texto);border-right-color:transparent}
@keyframes ds-gira{to{transform:rotate(360deg)}}
.in:hover,.in.is-hover{border-color:var(--ds-texto-2)}
.in:disabled{background:var(--ds-hover);border-color:var(--ds-hover);color:var(--ds-texto-3)}
.in::placeholder{color:var(--ds-texto-3)}
.seg button:hover{color:var(--ds-texto)}
.sw:disabled{background:var(--ds-hover);cursor:not-allowed}
.op:not([aria-checked="true"]):not(:disabled):hover,.dt:not([aria-pressed="true"]):not(:disabled):hover,.sl:not([aria-pressed="true"]):not(:disabled):hover,.sl.is-hover{border-color:var(--ds-texto-2)}
@media (prefers-reduced-motion:reduce){.btn.is-carregando::after{animation-duration:2.4s}}

</style>
</helmet>
<div class="ds" style="min-height: 900px">
<div style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,0.9fr); min-height: 900px">
  <div style="display: flex; flex-direction: column; padding: 40px 56px">
    <img src="../../../web/public/logo-horizontal.svg" alt="Dayspot" style="height: 24px; align-self: flex-start">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center"><form style="width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 18px" aria-labelledby="t">
  <div><h1 class="h1" id="t">Criar minha agenda</h1><p class="t2" style="margin-top: 6px">Leva dois minutos. Depois você cadastra os serviços e os horários.</p></div>
  <h2 class="h4" style="margin-top: 4px">Você</h2>
  <div class="campo"><label for="nome">Seu nome</label><input class="in" id="nome" autocomplete="name" value="Lucas Lima"></div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <div class="campo"><label for="email">E-mail</label><input class="in" id="email" type="email" value="lucas@barbearialima.com.br"></div>
    <div class="campo"><label for="senha">Senha</label><input class="in" id="senha" type="password" value="••••••••••"><p class="ajuda">Pelo menos 8 caracteres.</p></div>
  </div>
  <h2 class="h4" style="margin-top: 4px">Sua empresa</h2>
  <div class="campo"><label for="emp">Nome da empresa</label><input class="in" id="emp" value="Barbearia Lima"></div>
  <div class="campo"><label for="slug">Endereço da empresa</label>
    <div style="display: flex; align-items: stretch; border: 1.5px solid var(--ds-erro); border-radius: 16px; overflow: hidden; background: var(--ds-superficie)"><span style="display: flex; align-items: center; padding: 0 4px 0 16px; color: var(--ds-texto-2)">dayspot.app/</span><input id="slug" value="barbearia-lima" aria-describedby="slug-e" style="font-family: inherit; font-size: 16px; border: 0; height: 45px; flex: 1; min-width: 0; padding-right: 16px; color: var(--ds-texto)"></div>
    <p class="ajuda" id="slug-e" style="color: var(--ds-erro-texto)">Esse endereço já está em uso. Que tal barbearia-lima-centro?</p>
  </div>
  <p class="leg">Fuso: horário de Brasília. Dá para mudar depois em Configurações.</p>
  <button class="btn b1" type="submit" style="height: 52px">Criar minha agenda</button>
  <p style="text-align: center">Já tem conta? <a href="#" style="font-weight: 600">Entrar</a></p>
</form></div>
  </div>
  <aside aria-hidden="true" style="background: var(--ds-degrade); position: relative; overflow: hidden; display: grid; place-items: center">
  <svg viewBox="0 0 560 800" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: .1"><defs><pattern id="arc" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M15 25H22A11 11 0 0 0 32.6 11.4" fill="none" stroke-width="4.5" stroke-linecap="round" style="stroke: var(--ds-superficie)"/></pattern></defs><rect width="560" height="800" fill="url(#arc)"/></svg>
  <svg width="168" height="192" viewBox="4 0 56 64" style="position: relative"><path d="M15 6A6 6 0 0 1 21 12V52A6 6 0 0 1 9 52V12A6 6 0 0 1 15 6Z" style="fill: var(--ds-marca-claro)"/><path d="M15 58H30A26 26 0 0 0 54.727 23.966A5.976 5.976 0 0 0 43.361 27.659A15 15 0 0 1 29 47H15Z" style="fill: var(--ds-marca-claro)"/><path d="M27.25 12.75A7.25 7.25 0 1 0 41.75 12.75A7.25 7.25 0 1 0 27.25 12.75Z" style="fill: var(--ds-dia-manha)"/></svg>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
