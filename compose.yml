# Nome fixo do projeto: containers e volume (dayspot_postgres_data) não dependem da pasta do clone.
name: dayspot

services:
  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "127.0.0.1:5467:5432" # só nesta máquina
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Só roda com volume vazio: banco antigo precisa de `docker compose down -v` uma vez.
      - ./db/init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8088:8080"

volumes:
  postgres_data:
