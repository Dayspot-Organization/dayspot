name: CI

# Push na dev publica na homologação; o botão (Run workflow) na main publica na produção.
# Os dois só depois dos testes (docs/deploy.md).
on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: .NET Format, Build & Test
    runs-on: ubuntu-latest

    # Banco só de teste, descartado ao fim do job: senhas fixas não são segredo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dayspot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dayspot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: ci
      POSTGRES_DB: dayspot
      PGHOST: localhost
      PGPASSWORD: ci
      APP_USER_PASSWORD: ci_app
      MIGRATIONS_DATABASE_URL: postgres://ci:ci@localhost:5432/dayspot?sslmode=disable
      DATABASE_URL: postgres://app_user:ci_app@localhost:5432/dayspot?sslmode=disable

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore

      # dotnet-ef na versão do .config/dotnet-tools.json, a mesma do EF Core.
      - name: Restaurar ferramentas (dotnet-ef)
        run: dotnet tool restore

      - name: Formatação (dotnet format)
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar (dotnet build)
        run: dotnet build --no-restore -warnaserror

      # Modelo do AppDb diferente do snapshot = faltou gerar a migration.
      - name: Migrations pendentes no modelo
        run: dotnet ef migrations has-pending-model-changes --project src/Api --no-build

      # Antes das migrations: a 009 faz REVOKE para o app_user (guia §009).
      - name: Criar app_user
        run: sh db/init/app_user.sh

      - name: Migrations (Up)
        run: dotnet ef database update --project src/Api --no-build

      - name: Migrations (Down e Up de novo)
        run: |
          dotnet ef database update 0 --project src/Api --no-build
          dotnet ef database update --project src/Api --no-build

      # Os testes de banco leem os dados do seed.
      - name: Seed
        run: psql "$MIGRATIONS_DATABASE_URL" -f db/seed.sql

      # Com CI definida, teste de banco sem DATABASE_URL ou MIGRATIONS_DATABASE_URL falha em vez de pular.
      - name: Executar testes (dotnet test)
        run: dotnet test --no-build

  web:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node com cache do npm
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # PR e push na main só buildam; publicam o push na dev e o botão na main.
      PUBLICA: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
      API: ghcr.io/dayspot-organization/dayspot-api:${{ github.sha }}
      WEB: ghcr.io/dayspot-organization/dayspot-web:${{ github.sha }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Build da imagem da API
        run: docker build -t "$API" .

      - name: Build da imagem do front
        run: docker build -t "$WEB" web/

      - name: Publicar as imagens no GHCR
        if: env.PUBLICA == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$API"
          docker push "$WEB"

  deploy:
    name: Deploy
    needs: [build-and-test, web, docker]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # O Environment guarda a chave e limita a branch: homologacao só da dev, producao só da main.
    environment: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
      cancel-in-progress: false

    steps:
      # A chave só roda o deploy/deploy.sh (comando forçado): o pedido é ambiente e sha.
      - name: Deploy na VPS por SSH
        env:
          AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes "deploy@$HOST" "$AMBIENTE $GITHUB_SHA"
