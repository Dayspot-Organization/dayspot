name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: .NET Format, Build & Test
    runs-on: ubuntu-latest

    # Banco só de teste, descartado ao fim do job: senhas fixas não são segredo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dayspot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dayspot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: ci
      POSTGRES_DB: dayspot
      PGHOST: localhost
      PGPASSWORD: ci
      APP_USER_PASSWORD: ci_app
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://ci:ci@localhost:5432/dayspot?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations
      DATABASE_URL: postgres://app_user:ci_app@localhost:5432/dayspot?sslmode=disable

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore

      - name: Formatação (dotnet format)
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar (dotnet build)
        run: dotnet build --no-restore -warnaserror

      # Versão fixa, a mesma do README: binário da release, sem depender de Go.
      - name: Instalar goose v3.28.0
        run: |
          sudo curl -fsSL -o /usr/local/bin/goose https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64
          sudo chmod +x /usr/local/bin/goose
          goose --version

      # Antes do goose up: a 009 faz REVOKE para o app_user (guia §009).
      - name: Criar app_user
        run: sh db/init/app_user.sh

      - name: Migrations (goose up)
        run: goose up

      - name: Migrations (Down e Up de novo)
        run: goose down-to 0 && goose up

      # Os testes de banco leem os dados do seed.
      - name: Seed
        run: psql "$GOOSE_DBSTRING" -f db/seed.sql

      # Com CI definida, teste de banco sem DATABASE_URL ou GOOSE_DBSTRING falha em vez de pular.
      - name: Executar testes (dotnet test)
        run: dotnet test --no-build

  web:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node com cache do npm
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
