<div class="app">
  <aside class="lateral">
    <app-logo />
    <app-menu />
  </aside>

  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- Esc já fecha o <dialog> nativo -->
  <dialog #gaveta class="gaveta" aria-label="Menu" (click)="cliqueNaGaveta($event)">
    <div class="gaveta-topo">
      <app-logo />
      <button type="button" class="icone" aria-label="Fechar menu" (click)="fechar()">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <app-menu (navegar)="fechar()" />
  </dialog>

  <div>
    <header class="topo">
      <button type="button" class="icone abrir-menu" aria-label="Abrir menu" (click)="abrir()">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <nav class="trilha" aria-label="Você está em">
        @for (passo of trilha(); track passo.caminho; let ultimo = $last) {
          @if (ultimo) {
            <h1>{{ passo.titulo }}</h1>
          } @else {
            <span><a [routerLink]="passo.caminho">{{ passo.titulo }}</a> ›</span>
          }
        }
      </nav>
      <app-botao-tema [tema]="tema.tema()" (trocar)="tema.trocar()" />
    </header>
    <main class="conteudo">
      <router-outlet />
    </main>
  </div>
</div>
