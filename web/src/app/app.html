@if (publica()) {
  <router-outlet />
} @else {
  <div class="app">
    <aside class="lateral">
      <app-logo />
      <app-menu />
    </aside>

    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- Esc já fecha o <dialog> nativo -->
    <dialog #gaveta class="gaveta" aria-label="Menu" (click)="cliqueNaGaveta($event)">
      <div class="gaveta-topo">
        <app-logo />
        <button type="button" class="botao-icone" aria-label="Fechar menu" (click)="fechar()">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <app-menu (navegar)="fechar()" />
    </dialog>

    <div class="coluna">
      <header class="topo">
        <button type="button" class="botao-icone abrir-menu" aria-label="Abrir menu" (click)="abrir()">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
        <!-- O título da tela fica no cabeçalho do conteúdo (h1); aqui só a trilha. -->
        <nav class="trilha" aria-label="Você está em">
          @for (passo of trilha(); track passo.caminho; let ultimo = $last) {
            @if (ultimo) {
              <span aria-current="page">{{ passo.titulo }}</span>
            } @else {
              <a [routerLink]="passo.caminho">{{ passo.titulo }}</a>
              <span aria-hidden="true">›</span>
            }
          }
        </nav>
        <app-botao-tema [tema]="tema.tema()" (trocar)="tema.trocar()" />
      </header>
      <main class="conteudo">
        <router-outlet />
      </main>
    </div>
  </div>
}
