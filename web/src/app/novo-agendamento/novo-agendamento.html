@if (erroClientes()) {
  <app-mensagem-erro [mensagem]="erroClientes()" podeRepetir (tentarDeNovo)="clientes.reload()" />
} @else if (!clientes.hasValue() || clientes.isLoading()) {
  <app-carregando />
} @else if (clientes.value().length === 0) {
  <app-vazio ilustracao="clientes">Nenhum cliente cadastrado ainda.</app-vazio>
} @else {
  <form class="cartao formulario" (submit)="salvar($event)">
    <div>
      <label for="cliente">Cliente</label>
      <select #campoCliente id="cliente" required (change)="clienteId.set(campoCliente.value)">
        <option value="" [selected]="clienteId() === ''">Escolha o cliente</option>
        @for (c of clientes.value(); track c.id) {
          <option [value]="c.id" [selected]="clienteId() === c.id">{{ c.nome }}</option>
        }
      </select>
    </div>
    <div class="linha">
      <div>
        <label for="data">Data</label>
        <input #campoData id="data" type="date" required [value]="data()" (input)="data.set(campoData.value)" />
      </div>
      <div>
        <label for="hora">Hora de início</label>
        <input #campoHora id="hora" type="time" required [value]="hora()" (input)="hora.set(campoHora.value)" />
      </div>
      <div>
        <label for="duracao">Duração (min)</label>
        <input
          #campoDuracao
          id="duracao"
          type="number"
          required
          min="5"
          max="1440"
          step="5"
          [value]="duracao()"
          (input)="duracao.set(campoDuracao.value)"
        />
      </div>
    </div>
    @if (erro()) {
      <app-mensagem-erro [mensagem]="erro()" />
    }
    <div>
      <button class="botao" type="submit" [disabled]="enviando()">{{ enviando() ? "Salvando…" : "Salvar" }}</button>
    </div>
  </form>
}
