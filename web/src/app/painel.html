<div class="casca" [class.casca--menu-aberto]="trilhoAberto()">
  <header class="casca-topo">
    <!-- A empresa ativa, sem a seta da troca: no piloto cada pessoa tem uma empresa só. -->
    <div class="casca-empresa">
      <svg class="casca-simbolo" viewBox="6 3 53 58" width="22" height="24" aria-hidden="true">
        <path d="M15 6A6 6 0 0 1 21 12V52A6 6 0 0 1 9 52V12A6 6 0 0 1 15 6Z" />
        <path d="M15 58H30A26 26 0 0 0 54.727 23.966A5.976 5.976 0 0 0 43.361 27.659A15 15 0 0 1 29 47H15Z" />
        <path d="M27.25 12.75A7.25 7.25 0 1 0 41.75 12.75A7.25 7.25 0 1 0 27.25 12.75Z" />
      </svg>
      @if (eu.value()?.empresa_ativa; as empresa) {
        <span [title]="empresa.nome">{{ empresa.nome }}</span>
      }
    </div>

    <button
      type="button"
      class="casca-conta"
      popovertarget="menu-conta"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuAberto()"
      [attr.aria-label]="rotuloConta()"
    >
      <span class="casca-avatar" aria-hidden="true">{{ iniciais() }}</span>
    </button>
    <!-- Menu suspenso no popover nativo; o aviso de erro fica fora do role="menu", que só aceita opções. -->
    <div
      #menu
      id="menu-conta"
      popover
      class="ds-menu casca-menu"
      (toggle)="aoAbrirOuFechar($event)"
    >
      <div role="menu" aria-label="Sua conta" tabindex="-1" (keydown)="teclaNoMenu($event, menu)">
        <button
          type="button"
          class="ds-opcao"
          role="menuitemcheckbox"
          [attr.aria-checked]="tema.tema() === 'escuro'"
          (click)="trocarTema(menu)"
        >
          Tema escuro
          <svg lucideCheck class="ds-ic ds-opcao-ok" aria-hidden="true"></svg>
        </button>
        <div class="ds-menu-sep" role="separator"></div>
        <button type="button" class="ds-opcao" role="menuitem" [attr.aria-disabled]="saindo()" (click)="sair()">
          Sair
        </button>
      </div>
      @if (erroSair()) {
        <p class="ds-aviso ds-aviso--erro casca-menu-erro" role="alert">
          <svg lucideCircleAlert class="ds-ic" aria-hidden="true"></svg>
          <span>{{ erroSair() }}</span>
        </p>
      }
    </div>
  </header>

  <!-- No piloto o menu tem só a Agenda, de onde sai o Novo agendamento; o menu por papel vem depois. -->
  <nav class="casca-trilho" aria-label="Menu principal">
    <a class="casca-item" routerLink="/agendamentos" routerLinkActive="ativo" ariaCurrentWhenActive="page">
      <svg lucideCalendar class="ds-ic" aria-hidden="true"></svg>
      <span class="casca-item-nome">Agenda</span>
    </a>
    <!-- Aberto com o nome ou recolhido só com os ícones; a escolha fica salva no navegador. -->
    <button type="button" class="casca-item casca-alternar" [attr.aria-expanded]="trilhoAberto()" (click)="alternarTrilho()">
      @if (trilhoAberto()) {
        <svg lucidePanelLeftClose class="ds-ic" aria-hidden="true"></svg>
        <span class="casca-item-nome">Recolher menu</span>
      } @else {
        <svg lucidePanelLeftOpen class="ds-ic" aria-hidden="true"></svg>
        <span class="casca-item-nome">Expandir menu</span>
      }
    </button>
  </nav>

  <!-- Cada tela decide o próprio espaço: a Agenda ocupa o painel; as da v2.1 usam o .conteudo. -->
  <main class="casca-painel">
    <router-outlet />
  </main>
</div>
